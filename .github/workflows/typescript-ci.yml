name: TypeScript CI
on:
  workflow_call:
    inputs:
      node-version: {type: string, default: '22'}
      working-directory: {type: string, default: '.'}
      install-command: {type: string, default: 'pnpm install --frozen-lockfile'}
      typecheck-command: {type: string, default: 'pnpm exec tsc --noEmit'}
      test-command: {type: string, default: 'pnpm exec vitest run'}
jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
      - uses: pnpm/action-setup@v4
      - run: ${{ inputs.install-command }}
      - run: pnpm exec biome check .
      - run: ${{ inputs.typecheck-command }}
      - run: ${{ inputs.test-command }}
