name: DBC CI
on:
  workflow_call:
    inputs:
      python-version: {type: string, default: '3.12'}
      validation-command: {type: string, default: ''}
      working-directory: {type: string, default: '.'}
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
      - name: DBC 파일 목록 확인
        run: |
          if git ls-files '*.dbc' | grep -q .; then
            git ls-files '*.dbc'
          else
            echo 'No DBC files yet; skipping DBC-specific validation.'
          fi
      - name: Repository validation 실행
        if: ${{ inputs.validation-command != '' }}
        run: ${{ inputs.validation-command }}
