name: Feature request
description: 새로운 기능이나 개선을 제안해 주세요.
title: "[Feature]: "
labels: [feature]
body:
  - type: textarea
    id: feature
    attributes: {label: 제안 기능}
    validations: {required: true}
  - type: textarea
    id: problem
    attributes: {label: 해결하려는 문제}
    validations: {required: true}
  - type: textarea
    id: approach
    attributes: {label: 제안 방식}
  - type: input
    id: repositories
    attributes: {label: 영향 Repository, placeholder: "예: sdk, car"}
  - type: textarea
    id: alternatives
    attributes: {label: 대안}
  - type: textarea
    id: additional
    attributes: {label: 추가 정보}
